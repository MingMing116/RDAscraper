name: Windows live news verification

# External search can fail because of provider or runner network policy.
# This manual workflow never replaces or fabricates a failed live response.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-live:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify dependencies and build the current standalone executable
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Go dependency download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Go dependency verification failed' }
          ./build_windows.ps1
      - name: Install locked developer test dependencies
        run: npm ci --no-audit --no-fund
      - name: Test native executable with installed Edge and live public news
        run: ./tests/windows_e2e.ps1 -Binary dist/RDAscraper.exe
      - name: Preserve actual success or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RDAscraper-native-Windows-live-evidence
          path: tests/artifacts/live_browser/
          if-no-files-found: warn
          retention-days: 14
