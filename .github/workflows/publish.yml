name: Publish verified Windows release

on:
  workflow_run:
    workflows: [Verify and build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish verified Windows release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && contains(github.event.workflow_run.head_commit.message, '[publish-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v65.3.1
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the verified artifact from this run
        run: gh run download "$BUILD_RUN_ID" --repo "$GH_REPO" --name RDAscraper-Windows-x64 --dir release
      - name: Verify the Windows ZIP checksum
        working-directory: release
        run: |
          test -s RDAscraper_Windows_x64.zip
          test -s SHA256SUMS.txt
          python3 - <<'VERIFY'
          import hashlib, pathlib
          archive = pathlib.Path('RDAscraper_Windows_x64.zip')
          expected = [line.split()[0] for line in pathlib.Path('SHA256SUMS.txt').read_text().splitlines() if line.strip() and line.split()[-1] == archive.name]
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert len(expected) == 1 and actual == expected[0].lower(), 'Windows ZIP checksum mismatch'
          print('Verified Windows ZIP SHA-256:', actual)
          VERIFY
      - name: Publish this verified commit without replacing an existing release
        run: |
          tag_count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq 'length')
          test "$tag_count" = '0' || { echo 'Release tag already exists; refusing to replace it.'; exit 1; }
          cat > release-notes.txt <<'NOTES'
          RDAscraper 65.3.1 Windows 64비트 배포판입니다.

          RDAscraper_Windows_x64.zip을 내려받아 압축 해제한 뒤 RDAscraper.exe를 실행하세요.
          Python 또는 별도 OCR 프로그램은 필요하지 않습니다.
          저장 형식은 XLSX, CSV, 검수 목록 PDF입니다.

          이 파일은 해당 커밋의 Linux 회귀시험과 Windows 실행파일·Chromium 통합시험을 통과한 자동 빌드입니다.
          자동 시험의 뉴스 응답은 합성 자료이며, 실제 공개 뉴스 검색의 성공을 보증하는 기록은 아닙니다.
          ZIP에는 한 장 설명서와 제3자 라이선스가 포함됩니다. SHA256SUMS.txt로 파일을 확인할 수 있습니다.
          NOTES
          gh release create "$RELEASE_TAG" release/RDAscraper_Windows_x64.zip release/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$BUILD_COMMIT" --title 'RDAscraper 65.3.1' --notes-file release-notes.txt
